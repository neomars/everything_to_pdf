name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer pandoc xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npm ci
      - name: Génère un document de test
        run: |
          printf '# Titre\n\nUn paragraphe avec accents éàü.\n' | pandoc -f markdown -o "$RUNNER_TEMP/rapport.odt"
          echo "SAMPLE_ODT=$RUNNER_TEMP/rapport.odt" >> "$GITHUB_ENV"
      - run: npm test
      - run: xvfb-run -a node test/e2e-electron.js
      - name: Glisser-déposer de fichiers et de dossiers (événements natifs)
        run: xvfb-run -a node test/e2e-dnd.js

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      # Les paquets sont lancés pour de vrai, sans option, comme le fait un utilisateur. Le runner
      # Ubuntu 24.04 restreint les espaces de noms utilisateur (AppArmor) et reproduit donc l'erreur
      # « The SUID sandbox helper binary was found, but is not configured correctly ».
      - name: Lancer le .deb installé et l'AppImage (sans --no-sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libasound2t64 libgbm1 ./dist/*.deb
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          if unshare --user --map-root-user --pid --fork true; then echo "espaces de noms utilisateur : utilisables"; else echo "espaces de noms utilisateur : refusés"; fi
          test "$(stat -c '%a %U' '/opt/EverythingToPDF/chrome-sandbox')" = "4755 root"

          smoke() {
            name=$1; shift
            dir="$RUNNER_TEMP/smoke-$name"; mkdir -p "$dir/home"
            printf 'Bonjour\n' > "$dir/a.txt"
            HOME="$dir/home" xvfb-run -a "$@" "$dir/a.txt" > "$dir/run.log" 2>&1 &
            for _ in $(seq 60); do [ -s "$dir/a.pdf" ] && break; sleep 1; done
            tail -n 15 "$dir/run.log"
            [ -s "$dir/a.pdf" ] || { echo "::error::$name : aucun PDF produit"; return 1; }
            echo "$name : OK"
          }
          smoke deb everything-to-pdf
          # Un lanceur resté sur l'ancien dossier (1.0.0, avec espaces) doit continuer de fonctionner
          test -L '/opt/Everything to PDF'
          smoke legacy '/opt/Everything to PDF/everything-to-pdf'
          chmod +x dist/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1   # pas de FUSE sur les runners
          smoke appimage "$PWD"/dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
